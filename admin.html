<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScienceLab: Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js for Line Graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <div class="main-wrapper" style="margin-left: 0;">
            <header class="top-header">
                <div class="header-title">
                    <h1>Admin Control Panel</h1>
                </div>
            </header>
            <main class="content-body">
                <div class="container">
                    
                    <!-- Popup Ads Management Card -->
                    <div class="card">
                        <h2 class="card-title"><i class="fa-solid fa-rectangle-ad"></i> Manage Popup Advertisement</h2>
                        <div class="control-group">
                            <label>Ad Image URL</label>
                            <input type="text" id="adImageUrl" placeholder="https://example.com/image.png">
                        </div>
                        <div class="control-group">
                            <label>Button Name</label>
                            <input type="text" id="adButtonName" placeholder="Upgrade Now">
                        </div>
                        <div class="control-group">
                            <label>Button URL</label>
                            <input type="text" id="adButtonUrl" placeholder="https://example.com/target">
                        </div>
                        <button class="btn" id="saveAdBtn"><i class="fa-solid fa-save"></i> Save & Publish Ad</button>
                    </div>

                    <!-- YouTube Guides Management Card -->
                    <div class="card">
                        <h2 class="card-title"><i class="fa-brands fa-youtube"></i> Add YouTube Video Guide to Practical</h2>
                        <div class="control-group">
                            <label>Select Practical</label>
                            <select id="practicalSelect">
                                <option value="10.html">Micrometer Screw Gauge</option>
                                <option value="18.html">Vernier Caliper</option>
                                <option value="7.html">Simple Pendulum</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>YouTube Video Embed / Watch Link</label>
                            <input type="text" id="ytVideoUrl" placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <button class="btn" id="saveYtBtn"><i class="fa-solid fa-plus"></i> Attach Video Guide</button>
                    </div>

                    <!-- Analytics & Views Card -->
                    <div class="card">
                        <h2 class="card-title"><i class="fa-solid fa-chart-line"></i> Practical Views Analytics</h2>
                        <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                            <div>
                                <label>Start Date</label>
                                <input type="date" id="startDateFilter">
                            </div>
                            <div>
                                <label>End Date</label>
                                <input type="date" id="endDateFilter">
                            </div>
                            <div style="align-self: flex-end;">
                                <button class="btn" id="filterBtn" style="padding: 12px 20px;"><i class="fa-solid fa-filter"></i> Filter</button>
                                <button class="btn btn-secondary" id="exportPdfBtn" style="padding: 12px 20px;"><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
                            </div>
                        </div>
                        <div style="position: relative; height:300px; width:100%">
                            <canvas id="viewsChart"></canvas>
                        </div>
                    </div>

                    <!-- Feedbacks Display Card -->
                    <div class="card">
                        <h2 class="card-title"><i class="fa-solid fa-comments"></i> User Feedbacks (from rate.html)</h2>
                        <div class="table-responsive">
                            <table class="data-table" id="feedbackTable">
                                <thead>
                                    <tr>
                                        <th>Rating</th>
                                        <th>Feedback Message</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody id="feedbackTableBody">
                                    <tr><td colspan="3" style="text-align: center;">Loading feedbacks...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>
    <script type="module" src="admin.js"></script>
</body>
</html>
