<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Practical: Oscillations of a Helical Spring</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-color: #00838f;
      --secondary-color: #e0f7fa;
      --accent-color: #00acc1;
      --text-color: #263238;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--primary-color);
      font-size: 1.6rem;
    }

    header p {
      font-size: 0.9rem;
      color: #546e7a;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .container {
        grid-template-columns: 350px 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid #e0e0e0;
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-bottom: 12px;
      border-bottom: 2px solid var(--secondary-color);
      padding-bottom: 5px;
    }

    /* Simulation Canvas Container */
    .sim-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fafafa;
      border: 1px dashed #b0bec5;
      border-radius: 6px;
      padding: 10px;
      position: relative;
    }

    canvas#simCanvas {
      background: #fff;
      border: 1px solid #cfd8dc;
      border-radius: 4px;
      max-width: 100%;
    }

    /* Controls */
    .control-group {
      margin-top: 15px;
      width: 100%;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--primary-color);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--accent-color);
    }

    button:disabled {
      background-color: #b0bec5;
      cursor: not-allowed;
    }

    .btn-sec {
      background-color: #78909c;
    }

    .btn-sec:hover {
      background-color: #607d8b;
    }

    /* Readouts */
    .stopwatch-display {
      font-family: monospace;
      font-size: 1.4rem;
      background: #263238;
      color: #00e676;
      padding: 6px 15px;
      border-radius: 4px;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* Data Table */
    .table-responsive {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: center;
    }

    th, td {
      border: 1px solid #cfd8dc;
      padding: 8px 4px;
    }

    th {
      background-color: var(--secondary-color);
      color: var(--primary-color);
    }

    /* Graph Canvas */
    .graph-container {
      position: relative;
      width: 100%;
      height: 300px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Verification of $T^2 \propto m$ for a Helix Spring</h1>
    <p>Virtual Physics Practical Simulator</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Apparatus & Controls</h2>
      
      <div class="sim-box">
        <canvas id="simCanvas" width="280" height="320"></canvas>
        <div class="stopwatch-display" id="timerDisplay">00:00.00</div>
        <div style="font-size: 0.8rem; margin-top: 4px; color: #546e7a;">Oscillations: <span id="oscCount">0</span> / 50</div>
      </div>

      <div class="control-group">
        <label for="massSlider">
          <span>Suspended Mass ($m$):</span>
          <span id="massVal">50 g</span>
        </label>
        <input type="range" id="massSlider" min="50" max="350" step="50" value="50">
      </div>

      <div class="btn-group">
        <button id="startBtn">Release & Time (50 Osc)</button>
        <button id="resetBtn" class="btn-sec">Reset</button>
      </div>
      
      <div class="btn-group">
        <button id="recordBtn" style="background-color: #2e7d32;" disabled>Record Data Point</button>
      </div>
    </div>

    <div class="card">
      <h2>Readings & Analysis</h2>
      
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th rowspan="2">$m$ (g)</th>
              <th colspan="2">Time for 50 oscillations (s)</th>
              <th rowspan="2">$T$ (s)</th>
              <th rowspan="2">$T^2$ ($\text{s}^2$)</th>
            </tr>
            <tr>
              <th>Trial 1</th>
              <th>Trial 2</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            </tbody>
        </table>
      </div>

      <div style="margin-top: 15px;">
        <button id="clearTableBtn" class="btn-sec" style="font-size: 0.8rem; padding: 5px 10px;">Clear Table</button>
      </div>

      <h2 style="margin-top: 20px;">Graph: $T^2$ vs $m$</h2>
      <div class="graph-container">
        <canvas id="graphCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Physics Parameters
    const k = 25; // Spring constant (N/m)
    const TARGET_OSC = 50;

    // Simulation State Variables
    let mass = 0.05; // mass in kg (50g default)
    let animating = false;
    let startTime = 0;
    let elapsedTime = 0;
    let currentOscillations = 0;
    let animReqId = null;

    // Data Storage Structure: { massG: 50, t1: null, t2: null, period: null, periodSq: null }
    let dataset = [
      { massG: 50, t1: null, t2: null, period: null, periodSq: null },
      { massG: 100, t1: null, t2: null, period: null, periodSq: null },
      { massG: 150, t1: null, t2: null, period: null, periodSq: null },
      { massG: 200, t1: null, t2: null, period: null, periodSq: null },
      { massG: 250, t1: null, t2: null, period: null, periodSq: null },
      { massG: 300, t1: null, t2: null, period: null, periodSq: null }
    ];

    // Canvas Elements
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const timerDisplay = document.getElementById('timerDisplay');
    const oscCountDisplay = document.getElementById('oscCount');

    // UI Controls
    const massSlider = document.getElementById('massSlider');
    const massVal = document.getElementById('massVal');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const recordBtn = document.getElementById('recordBtn');
    const clearTableBtn = document.getElementById('clearTableBtn');

    // Initialize Chart.js Graph
    const graphCtx = document.getElementById('graphCanvas').getContext('2d');
    const chart = new Chart(graphCtx, {
      type: 'scatter',
      data: {
        datasets: [{
          label: 'T² vs m',
          data: [],
          backgroundColor: '#00838f',
          borderColor: '#00838f',
          showLine: true,
          fill: false,
          tension: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            type: 'linear',
            position: 'bottom',
            title: { display: true, text: 'Mass, m (g)' },
            min: 0,
            max: 350
          },
          y: {
            title: { display: true, text: 'Period Squared, T² (s²)' },
            min: 0
          }
        }
      }
    });

    // Drawing Apparatus
    function drawApparatus(yDisplacement = 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Stand Base and Rod
      ctx.fillStyle = '#616161';
      ctx.fillRect(30, 300, 140, 10); // Base
      ctx.fillRect(50, 20, 10, 280);   // Vertical rod
      ctx.fillRect(50, 30, 80, 8);    // Top clamp arm

      // Pointer Clamp on Support
      ctx.fillStyle = '#424242';
      ctx.fillRect(45, 180, 20, 12);
      // Locating Pin Line (Indicator reference)
      ctx.strokeStyle = '#00acc1';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(65, 186);
      ctx.lineTo(170, 186);
      ctx.stroke();
      ctx.setLineDash([]);

      // Helical Spring Drawing
      const startX = 110;
      const startY = 38;
      const restLength = 110 + (mass * 80); // Slight stretch based on weight
      const currentLength = restLength + yDisplacement;
      const turns = 14;

      ctx.strokeStyle = '#37474f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      
      for (let i = 0; i <= turns; i++) {
        const y = startY + (currentLength / turns) * i;
        const x = startX + (i % 2 === 0 ? 12 : -12);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(startX, startY + currentLength);
      ctx.stroke();

      // Suspended Mass Block
      const blockY = startY + currentLength;
      ctx.fillStyle = '#37474f';
      ctx.fillRect(startX - 15, blockY, 30, 30);
      
      // Weight slot detailing
      ctx.fillStyle = '#90a4ae';
      ctx.fillRect(startX - 12, blockY + 5, 24, 4);

      // Horizontal Indicator Pointer attached to Mass
      ctx.strokeStyle = '#d32f2f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX, blockY);
      ctx.lineTo(startX + 40, blockY);
      ctx.stroke();
    }

    // Update Simulation Frame
    function updateSim(timestamp) {
      if (!startTime) startTime = timestamp;
      
      const realTimeSec = (timestamp - startTime) / 1000;
      const T = 2 * Math.PI * Math.sqrt(mass / k); // Calculated period
      
      // Calculate oscillation displacement
      const amplitude = 20; // visual displacement amplitude
      const omega = (2 * Math.PI) / T;
      const yDisplacement = amplitude * Math.cos(omega * realTimeSec);

      // Track completed oscillations
      currentOscillations = Math.floor(realTimeSec / T);

      if (currentOscillations >= TARGET_OSC) {
        elapsedTime = TARGET_OSC * T;
        currentOscillations = TARGET_OSC;
        stopSimulation();
      } else {
        elapsedTime = realTimeSec;
        animReqId = requestAnimationFrame(updateSim);
      }

      // Add a slight realistic measurement noise (+/- 0.05s scale) when displaying total time
      timerDisplay.textContent = formatTime(elapsedTime);
      oscCountDisplay.textContent = currentOscillations;
      drawApparatus(yDisplacement);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const millis = Math.floor((seconds % 1) * 100);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(millis).padStart(2, '0')}`;
    }

    // Start Practical Run
    startBtn.addEventListener('click', () => {
      if (animating) return;
      animating = true;
      startTime = 0;
      startBtn.disabled = true;
      massSlider.disabled = true;
      recordBtn.disabled = true;
      animReqId = requestAnimationFrame(updateSim);
    });

    // Stop Simulation Run
    function stopSimulation() {
      animating = false;
      cancelAnimationFrame(animReqId);
      recordBtn.disabled = false;
      drawApparatus(0);
    }

    // Reset Controls
    resetBtn.addEventListener('click', () => {
      animating = false;
      cancelAnimationFrame(animReqId);
      startTime = 0;
      elapsedTime = 0;
      currentOscillations = 0;
      timerDisplay.textContent = "00:00.00";
      oscCountDisplay.textContent = "0";
      startBtn.disabled = false;
      massSlider.disabled = false;
      recordBtn.disabled = true;
      drawApparatus(0);
    });

    // Update Mass Slider
    massSlider.addEventListener('input', (e) => {
      const g = parseInt(e.target.value);
      massVal.textContent = `${g} g`;
      mass = g / 1000;
      drawApparatus(0);
    });

    // Record Data to Table
    recordBtn.addEventListener('click', () => {
      const mG = parseInt(massSlider.value);
      const row = dataset.find(d => d.massG === mG);

      // Add small experimental human reaction variation to stopwatch read
      const simulatedTime = elapsedTime + (Math.random() * 0.12 - 0.06);

      if (row.t1 === null) {
        row.t1 = simulatedTime;
      } else {
        row.t2 = simulatedTime;
      }

      // If both trials present, update periodic calculations
      if (row.t1 !== null && row.t2 !== null) {
        const avg50 = (row.t1 + row.t2) / 2;
        row.period = avg50 / 50;
        row.periodSq = Math.pow(row.period, 2);
      } else if (row.t1 !== null) {
        row.period = row.t1 / 50;
        row.periodSq = Math.pow(row.period, 2);
      }

      updateTableAndGraph();
      recordBtn.disabled = true;
    });

    // Render Data Table & Refresh Plot
    function updateTableAndGraph() {
      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '';
      const graphData = [];

      dataset.forEach(d => {
        const tr = document.createElement('tr');

        const t1Str = d.t1 !== null ? d.t1.toFixed(2) : '-';
        const t2Str = d.t2 !== null ? d.t2.toFixed(2) : '-';
        const tStr = d.period !== null ? d.period.toFixed(3) : '-';
        const t2SqStr = d.periodSq !== null ? d.periodSq.toFixed(4) : '-';

        tr.innerHTML = `
          <td>${d.massG}</td>
          <td>${t1Str}</td>
          <td>${t2Str}</td>
          <td>${tStr}</td>
          <td>${t2SqStr}</td>
        `;
        tbody.appendChild(tr);

        if (d.periodSq !== null) {
          graphData.push({ x: d.massG, y: d.periodSq });
        }
      });

      // Update Plot Data
      chart.data.datasets[0].data = graphData;
      chart.update();
    }

    // Clear Table Data
    clearTableBtn.addEventListener('click', () => {
      dataset.forEach(d => {
        d.t1 = null;
        d.t2 = null;
        d.period = null;
        d.periodSq = null;
      });
      updateTableAndGraph();
    });

    // Initial Drawing Setup
    drawApparatus(0);
    updateTableAndGraph();
  </script>
</body>
</html>
