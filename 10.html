<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonometer Practical Simulator</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #007bc7;
      --accent-hover: #005fa3;
      --border-color: #cccccc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin-bottom: 5px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #666;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      width: 100%;
      max-width: 900px;
    }

    @media (min-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
      .canvas-card {
        grid-column: span 2;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 4px;
    }

    canvas {
      width: 100%;
      height: 220px;
      background: #eef4f8;
      border: 1fr solid var(--border-color);
      border-radius: 6px;
      display: block;
    }

    .control-group {
      margin-bottom: 12px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      accent-color: var(--accent-color);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button.secondary {
      background-color: #6c757d;
    }

    button.secondary:hover {
      background-color: #5a6268;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: center;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 6px;
    }

    th {
      background-color: #e9ecef;
    }

    .status-box {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      background: #e9f5ff;
      border-left: 4px solid var(--accent-color);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .info-box {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #444;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sonometer Experiment Simulator</h1>
    <p class="subtitle">Determination of the frequency of a tuning fork using resonance</p>
  </header>

  <main class="container">
    <div class="card canvas-card">
      <h2>Apparatus View</h2>
      <canvas id="simCanvas"></canvas>
      <div id="statusText" class="status-box">Status: Ready. Pluck wire or excite tuning fork to observe vibration.</div>
    </div>

    <div class="card">
      <h2>Controls</h2>
      <div class="control-group">
        <label>Suspended Mass ($M$): <span id="massVal">0.50 kg</span></label>
        <input type="range" id="massSlider" min="0.5" max="3.5" step="0.5" value="0.5" />
      </div>

      <div class="control-group">
        <label>Bridge Distance ($l$): <span id="lenVal">10.0 cm</span></label>
        <input type="range" id="lenSlider" min="5" max="100" step="0.1" value="10.0" />
      </div>

      <div class="control-group">
        <label>Wire Linear Mass Density ($m$): <span>0.00125 kg/m</span></label>
      </div>

      <div class="btn-group">
        <button id="pluckBtn">Vibrate Tuning Fork</button>
        <button id="recordBtn" class="secondary">Record Data</button>
      </div>
    </div>

    <div class="card">
      <h2>Recorded Data (Table 12.1)</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>$M$ (kg)</th>
              <th>$l$ (cm)</th>
              <th>$l^2$ ($\text{cm}^2$)</th>
            </tr>
          </thead>
          <tbody id="dataTable">
            </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    // Physics Constants
    const TRUE_FREQUENCY = 256; // Fixed hidden/known tuning fork frequency (Hz)
    const G = 9.81; // Gravity (m/s^2)
    const M_DENSITY = 0.00125; // Mass per unit length (kg/m)

    // Elements
    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");
    const massSlider = document.getElementById("massSlider");
    const lenSlider = document.getElementById("lenSlider");
    const massVal = document.getElementById("massVal");
    const lenVal = document.getElementById("lenVal");
    const statusText = document.getElementById("statusText");
    const pluckBtn = document.getElementById("pluckBtn");
    const recordBtn = document.getElementById("recordBtn");
    const dataTable = document.getElementById("dataTable");

    // Animation variables
    let isVibrating = false;
    let vibrationAmplitude = 0;
    let paperRiderFell = false;
    let animFrame;

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function calculateResonanceLength(M) {
      // f = 1/(2l) * sqrt(Mg/m) => l = 1/(2f) * sqrt(Mg/m)
      const l_meters = (1 / (2 * TRUE_FREQUENCY)) * Math.sqrt((M * G) / M_DENSITY);
      return l_meters * 100; // cm
    }

    function update() {
      const M = parseFloat(massSlider.value);
      const l = parseFloat(lenSlider.value);

      massVal.textContent = M.toFixed(2) + " kg";
      lenVal.textContent = l.toFixed(1) + " cm";

      const resonantLen = calculateResonanceLength(M);
      const diff = Math.abs(l - resonantLen);

      // Check for resonance condition (width of resonance curve)
      if (isVibrating) {
        if (diff < 0.6) {
          vibrationAmplitude = 12; // High amplitude at resonance
          paperRiderFell = true;
          statusText.textContent = "Resonance Reached! Paper rider was thrown off!";
          statusText.style.borderLeftColor = "#28a745";
        } else if (diff < 2.5) {
          vibrationAmplitude = Math.max(1, 12 - diff * 4);
          statusText.textContent = "Wire vibrating, near resonance...";
          statusText.style.borderLeftColor = "#ffc107";
        } else {
          vibrationAmplitude = 0.5;
          statusText.textContent = "Minimal vibration (Off resonance).";
          statusText.style.borderLeftColor = "#007bc7";
        }
      } else {
        vibrationAmplitude = 0;
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const w = canvas.width;
      const h = canvas.height;

      const sonometerY = h * 0.5;
      const bridge1X = w * 0.15;
      const wireMaxLen = w * 0.65;
      const currentLenPx = bridge1X + (wireMaxLen * (parseFloat(lenSlider.value) / 100));
      const pulleyX = w * 0.85;

      // Draw Sonometer Wooden Box
      ctx.fillStyle = "#d2b48c";
      ctx.fillRect(w * 0.1, sonometerY, w * 0.77, 30);
      ctx.strokeStyle = "#8b5a2b";
      ctx.strokeRect(w * 0.1, sonometerY, w * 0.77, 30);

      // Draw Bridges
      ctx.fillStyle = "#444";
      // Fixed left bridge
      ctx.beginPath();
      ctx.moveTo(bridge1X - 8, sonometerY);
      ctx.lineTo(bridge1X + 8, sonometerY);
      ctx.lineTo(bridge1X, sonometerY - 15);
      ctx.fill();

      // Adjustable right bridge
      ctx.beginPath();
      ctx.moveTo(currentLenPx - 8, sonometerY);
      ctx.lineTo(currentLenPx + 8, sonometerY);
      ctx.lineTo(currentLenPx, sonometerY - 15);
      ctx.fill();

      // Draw Pulley
      ctx.beginPath();
      ctx.arc(pulleyX, sonometerY + 5, 12, 0, Math.PI * 2);
      ctx.fillStyle = "#888";
      ctx.fill();
      ctx.stroke();

      // Draw Wire (Vibrating region between bridges)
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w * 0.1, sonometerY - 15);
      ctx.lineTo(bridge1X, sonometerY - 15);

      // Vibrating string dynamic rendering
      if (vibrationAmplitude > 0) {
        const midX = (bridge1X + currentLenPx) / 2;
        const waveY = (Math.sin(Date.now() * 0.05) * vibrationAmplitude);
        ctx.quadraticCurveTo(midX, sonometerY - 15 + waveY, currentLenPx, sonometerY - 15);
      } else {
        ctx.lineTo(currentLenPx, sonometerY - 15);
      }

      // Wire over pulley down to load
      ctx.lineTo(pulleyX, sonometerY - 15);
      ctx.lineTo(pulleyX + 12, sonometerY + 60);
      ctx.stroke();

      // Draw Paper Rider (if not fallen)
      if (!paperRiderFell) {
        const riderX = (bridge1X + currentLenPx) / 2;
        const riderOffsetY = (vibrationAmplitude > 0) ? (Math.sin(Date.now() * 0.05) * vibrationAmplitude) : 0;
        ctx.fillStyle = "#ff4d4d";
        ctx.beginPath();
        ctx.moveTo(riderX - 4, sonometerY - 15 + riderOffsetY);
        ctx.lineTo(riderX + 4, sonometerY - 15 + riderOffsetY);
        ctx.lineTo(riderX, sonometerY - 23 + riderOffsetY);
        ctx.closePath();
        ctx.fill();
      }

      // Draw Hanging Mass
      ctx.fillStyle = "#555";
      ctx.fillRect(pulleyX + 2, sonometerY + 60, 20, 25);
      ctx.fillStyle = "#fff";
      ctx.font = "10px sans-serif";
      ctx.fillText(massSlider.value + "kg", pulleyX + 3, sonometerY + 76);
    }

    function animate() {
      update();
      animFrame = requestAnimationFrame(animate);
    }

    pluckBtn.addEventListener("click", () => {
      isVibrating = true;
      paperRiderFell = false;
      setTimeout(() => {
        isVibrating = false;
      }, 3000);
    });

    recordBtn.addEventListener("click", () => {
      const M = parseFloat(massSlider.value);
      const l = parseFloat(lenSlider.value);
      const l2 = (l * l).toFixed(1);

      const row = document.createElement("tr");
      row.innerHTML = `<td>${M.toFixed(2)}</td><td>${l.toFixed(1)}</td><td>${l2}</td>`;
      dataTable.appendChild(row);
    });

    massSlider.addEventListener("input", update);
    lenSlider.addEventListener("input", update);

    // Initial setup
    animate();
  </script>
</body>
</html>
